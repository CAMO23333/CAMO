compute_environment: LOCAL_MACHINE

gpu_ids: all
num_processes: 1  # train.sh overrides this with NUM_PROCESSES when requested

debug: false
deepspeed_config:
  deepspeed_config_file: finetune/configs/zero2.yaml
  zero3_init_flag: false
distributed_type: DEEPSPEED
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
num_machines: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
main_process_port: 29501
